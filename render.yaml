# Render Blueprint for Sales Copilot.
#
# Build/runtime strategy (single, reproducible): npm + committed package-lock.json.
#   - `npm ci --include=dev` installs the exact locked tree, including build tools.
#   - `npm run build` produces dist/ (Vite) served by the Node server.
#   - `npm start` runs the TypeScript server through tsx (a runtime dependency),
#     never the Vite dev server.
#
# Secrets are marked `sync: false`: Render prompts for them in the dashboard and
# they are not stored in this repository.
services:
  - type: web
    name: ultraviolet-copilot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      # Self-hosted AI model service on Modal (see docs/self-hosted-ai-modal.md).
      # AI_SERVICE_URL is the public Modal app origin; AI_SERVICE_TOKEN must
      # match the Modal secret AI_SERVICE_TOKEN. Both stay server-side: browsers
      # only receive a short-lived same-origin /ws/ai ticket.
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: AI_SERVICE_MODEL
        sync: false
      - key: AI_MAX_CALL_SECONDS
        value: '3600'
      # TURN relay. TURN_SECRET (coturn REST style, short-lived credentials) is
      # preferred; TURN_USERNAME + TURN_CREDENTIAL are the static fallback.
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
      # Optional managed provider issuing short-lived credentials server-side.
      - key: TURN_CREDENTIALS_URL
        sync: false
      - key: TURN_CREDENTIALS_AUTH
        sync: false
      # rstream managed STUN/TURN (Control plane API). RSTREAM_AUTHENTICATION_TOKEN
      # is the server-side access token and must never reach the browser.
      # Configure exactly one of RSTREAM_PROJECT_ENDPOINT / RSTREAM_PROJECT_ID.
      - key: RSTREAM_AUTHENTICATION_TOKEN
        sync: false
      - key: RSTREAM_PROJECT_ENDPOINT
        sync: false
      - key: RSTREAM_PROJECT_ID
        sync: false
      - key: RSTREAM_API_BASE_URL
        sync: false
      # Optional static rstream TURN JSON credentials for temporary testing.
      # No API token/project is needed for this mode. These credentials EXPIRE and
      # must be replaced manually with fresh rstream JSON values; the server does
      # not renew them. RSTREAM_TURN_URLS is comma-separated.
      - key: RSTREAM_TURN_USERNAME
        sync: false
      - key: RSTREAM_TURN_CREDENTIAL
        sync: false
      - key: RSTREAM_TURN_URLS
        sync: false
      - key: RSTREAM_TURN_TTL_SECONDS
        sync: false
      # ExpressTURN free-tier credentials are entered at /admin/turn and kept in
      # server memory only (no disk, database, Render Shell or Secret Key).
      # The first visit creates its own setup password in the browser, so no
      # ADMIN_PASSWORD environment variable is needed or read.
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: STUN_URLS
        sync: false
      - key: ICE_TRANSPORT_POLICY
        value: all
      - key: TURN_TTL_SECONDS
        value: '3600'
      - key: MAX_SESSIONS
        value: '500'
